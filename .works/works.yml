company_name: Awesome POS Systems
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome POS Systems
initial_prompt: >-
  A curated directory of point-of-sale systems for retail and restaurants,
  including open-source POS. Include products such as Square, Shopify POS,
  Clover, Lightspeed, Toast, SumUp, Zettle, Revel Systems, Loyverse, Odoo Point
  of Sale, uniCenta oPOS, Floreant POS, plus other notable commercial and
  open-source options. Categories: Retail POS, Restaurant POS, Mobile & Tablet
  POS, Open-Source POS, POS Hardware, Payment-Integrated POS. For every item
  capture the official website, a short factual description, pricing model
  (free, freemium, paid, open source), deployment (cloud or self-hosted), key
  features and integrations.


  Initial categories: Retail POS; Restaurant POS; Mobile & Tablet POS;
  Open-Source POS; POS Hardware; Payment-Integrated POS.

  Target keywords: pos system, point of sale software, retail pos, restaurant
  pos.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://www.softwaresuggest.com/point-of-sale-pos-software

  - https://www.softwaresuggest.com/retail-pos-software

  - https://www.softwaresuggest.com/restaurant-pos-software

  - https://en.wikipedia.org/wiki/Category:Point_of_sale_companies

  - https://github.com/topics/pos

  - https://github.com/topics/point-of-sale


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-pos-systems-website
company_website: https://pos-systems.ever.works
