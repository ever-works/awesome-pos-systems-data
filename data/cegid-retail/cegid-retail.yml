markdown: >-
  ## Overview


  Cegid is a European software publisher providing retail and financial
  management solutions. Cegid Retail is its point-of-sale and omnichannel
  commerce platform for fashion and specialty retailers.


  ## Features


  - Point of sale transactions

  - Omnichannel commerce (online and in-store)

  - Inventory and replenishment

  - Customer relationship management

  - Mobile POS

  - Reporting and analytics


  ## Deployment


  Cloud-based


  ## Pricing


  Commercial paid enterprise software; pricing available via Cegid sales.
