name: Lavu
description: Lavu is a restaurant point-of-sale software that tracks inventory,
  manages online delivery of orders, accepts magnetic stripe and chip cards, and
  provides detailed reports. It is priced at $59 per user per month billed
  annually. The software is paid and cloud-based, suitable for startups through
  enterprises.
