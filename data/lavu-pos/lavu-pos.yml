markdown: >-
  ## Overview


  Lavu restaurant POS software provides tools for restaurant businesses
  including inventory tracking, online delivery order management, card payment
  acceptance, and detailed reporting.


  ## Features


  - Offline Mode

  - Customer Management

  - Mobile POS

  - Third Party Integrations

  - Inventory Management

  - Menu Management

  - Point of Sale (POS)

  - Reservations Management


  ## Pricing


  $59 per user per month, billed annually.


  ## Deployment


  Cloud-based deployment.
