markdown: >-
  ## Overview


  GOFRUGAL Restaurant POS is a restaurant billing software with inventory and
  kitchen order-taking solution for restaurants, bars, and fine dining. It is a
  simple restaurant management system to manage all transactions, recipe
  management, table layout and guest seating, and supports online food ordering
  systems.


  ## Key Features


  - Order Management

  - Table Management

  - Loyalty Programs

  - Kitchen Display System

  - Multi-store management

  - Mobile POS

  - Inventory Management

  - Reservations Management

  - Recipe management

  - Transaction management


  ## Pricing


  - Basic: $6 per store per month

  - Elite: $12 per store per month


  ## Deployment


  Cloud-based (SaaS).


  ## Target Segments


  Startups, SMBs, mid-market, and enterprises including restaurants, bars, and
  fine dining establishments.
