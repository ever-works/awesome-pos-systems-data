markdown: >-
  ## Overview


  Epos Now is a cloud-based retail POS system that helps businesses streamline
  their operations. A 30-day free trial is available to evaluate the system's
  capabilities.


  ## Pricing


  - **Standard**: $39 per month

  - **Premium**: $69 per month


  ## Target Segments


  Epos Now is tailored for startups, SMBs, mid-market businesses, and
  enterprises.


  ## Features


  - Employee Management

  - Purchase Orders

  - Third Party Integrations

  - Promotions And Discounts

  - Sales Reporting

  - Inventory Management

  - Customizable Receipts

  - Real Time
