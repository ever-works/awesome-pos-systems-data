markdown: >-
  ## Overview


  Ingenico Group (now part of Worldline) manufactures point-of-sale payment
  terminals and payment processing hardware used by merchants worldwide for
  in-person transactions.


  ## Features


  - Credit and debit card terminals

  - Contactless and NFC payments

  - Mobile payment acceptance

  - EMV chip card support

  - PIN entry and signature capture

  - Ethernet, Wi-Fi, and 4G connectivity


  ## Deployment


  Hardware terminals


  ## Pricing


  Commercial paid hardware and payment processing services; pricing varies by
  region and volume.
