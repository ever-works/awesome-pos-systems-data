markdown: >-
  ## Overview


  Restroworks powers 25,000+ restaurants worldwide with a cloud-based platform
  combining POS, inventory, kitchen automation, kiosks, and analytics, helping
  restaurant brands streamline operations, gain real-time insights, and scale
  efficiently.


  ## Key Features


  - Menu Management

  - Location Management

  - Discount Management

  - Security and Permissions

  - Table Management

  - Online Ordering

  - Order Management

  - Offline Mode

  - Kitchen automation

  - Kiosks

  - Analytics


  ## Pricing


  Contact sales for pricing (enterprise-grade platform; no public pricing
  listed).


  ## Deployment


  Cloud-based (SaaS).


  ## Target Segments


  Startups, SMBs, mid-market, and enterprises in the restaurant industry.
