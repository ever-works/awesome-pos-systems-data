markdown: >-
  ## Overview


  URY is a FOSS restaurant management system super powered by ERPNext. It
  extends ERPNext with restaurant-focused capabilities for order management,
  table handling, and restaurant operations.


  ## Deployment


  Self-hosted, built on the ERPNext platform (Frappe framework).


  ## Technology


  TypeScript is the primary language used in this repository.


  ## License


  Open source (FOSS).


  ## Pricing


  Free and open source.
