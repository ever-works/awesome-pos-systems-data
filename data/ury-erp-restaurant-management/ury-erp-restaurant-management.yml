name: URY ERP Restaurant Management
description: URY is a free and open-source (FOSS) restaurant management system
  built on top of ERPNext. It provides restaurant-specific operations on an
  ERPNext foundation, with TypeScript as the primary development language. The
  project is actively maintained, with its most recent update in November 2026.
