markdown: >-
  ## Overview


  Upserve POS is a restaurant point-of-sale and management system designed for
  restaurants of various sizes, from startups to enterprises.


  ## Features


  - Customer Management

  - Offline Mode

  - Employee Management

  - Split Billing

  - Tableside Ordering

  - Sales Reporting

  - Real Time

  - Online Ordering


  ## Pricing


  - Core: $99 per location per month

  - Pro: $249 per location per month


  ## Deployment


  Cloud-based SaaS deployment.
