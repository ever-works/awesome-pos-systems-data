name: Upserve POS
description: Upserve POS is a restaurant management system that handles
  tableside order management, floor plans, online payments, menu management,
  employee timetables, CRM, and reporting on a single platform. It supports
  multi-location sales analytics and offers tiered pricing per location per
  month. The software is paid, with Core and Pro plans available. It is deployed
  as a cloud-based SaaS solution for restaurants.
