markdown: >-
  ## Overview


  uniCenta oPOS is an open-source point of sale application forked from
  Openbravo POS. It is designed for retail and hospitality environments and can
  be deployed on-premise.


  ## Features


  - Point of sale transactions

  - Inventory management

  - Customer and supplier management

  - Multi-store support

  - Reporting and analytics

  - Receipt and barcode printing


  ## Deployment


  Self-hosted / On-premise


  ## Pricing


  Free and open-source under the GNU General Public License (GPL).


  ## Repository


  Source code available on GitHub.
