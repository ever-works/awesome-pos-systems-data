markdown: >
  ## Overview


  Triangle POS is an open source Inventory Management system with POS
  functionality, built with Laravel 10, Bootstrap 4, and Livewire 3.


  ## Features


  - Inventory management

  - Point of sale system

  - Built with Laravel 10 (PHP)

  - Bootstrap 4 frontend

  - Livewire 3 for reactive interfaces


  ## Pricing


  Completely free to use.


  ## Deployment


  Self-hosted.
