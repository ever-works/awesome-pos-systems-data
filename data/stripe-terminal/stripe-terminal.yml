markdown: >-
  ## Overview


  Stripe Terminal is Stripe's in-person payments product, allowing businesses to
  build custom point-of-sale experiences and accept physical card payments using
  Stripe's backend infrastructure.


  ## Features


  - Pre-certified card readers (Stripe Reader S700, BBPOS WisePOS E, Verifone
  P400)

  - Tap to Pay on iPhone and Android

  - Custom POS app development via SDKs

  - Cloud-based device management

  - Online and offline payment modes

  - Receipt printing and inventory sync


  ## Deployment


  Cloud-based with mobile and countertop hardware


  ## Pricing


  Pay-as-you-go transaction fees plus hardware costs; no monthly fees for the
  software platform.
