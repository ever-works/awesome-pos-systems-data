markdown: >-
  ## Overview


  Adyen is a global payment company that provides in-person and online payment
  processing. Its Terminal solution enables merchants to accept card-present
  payments through payment terminals connected to Adyen's platform.


  ## Features


  - Credit, debit, and prepaid card acceptance

  - Contactless and NFC payments

  - Apple Pay, Google Pay support

  - Unified commerce (online and in-person)

  - APIs and SDKs for custom integrations

  - Real-time transaction reporting


  ## Deployment


  Cloud-based with countertop and mobile hardware


  ## Pricing



  Interchange-plus pricing model with transaction fees; no monthly software
  fees.
