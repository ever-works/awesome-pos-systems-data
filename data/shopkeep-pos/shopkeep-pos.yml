name: ShopKeep
description: ShopKeep is a restaurant point-of-sale system described as
  reliable, fast, and easy to use. It helps businesses make decisions, keep
  customers happy, and support ordering. The system is paid and is suitable for
  startups, SMBs, mid-market, and enterprise customers. It is deployed as a
  cloud-based solution.
