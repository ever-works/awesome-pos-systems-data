markdown: >-
  ## Overview


  ShopKeep is a restaurant POS system designed for restaurants and small
  businesses.


  ## Features


  - Discount Management

  - Multi Store

  - Supplier Management

  - Tip Management

  - Integrated Payments

  - Purchase Orders

  - User Permissions

  - Offline Mode


  ## Pricing


  Pricing details are available upon request; starting price is not publicly
  listed.


  ## Deployment


  Cloud-based deployment.
