markdown: >-
  ## Overview


  Counterpoint is a retail point-of-sale and business management system
  originally developed by Radiant Systems and now part of NCR Voyix. It serves
  specialty retailers, convenience stores, and other small-to-mid-size
  merchants.


  ## Features


  - Point of sale transactions

  - Inventory and purchasing

  - Customer loyalty and marketing

  - Employee management

  - E-commerce integration

  - Reporting and analytics


  ## Deployment


  Cloud and on-premise


  ## Pricing


  Commercial paid software; pricing available via NCR Voyix sales.
