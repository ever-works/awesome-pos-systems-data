markdown: >-
  ## Overview


  lsFusion is a free, open-source, self-hosted ERP and CRM platform for small
  businesses. It unifies inventory, invoicing, manufacturing, sales, projects,
  HR, and point-of-sale functionality in a single system.


  ## Features


  - Point-of-sale functionality for retail operations

  - Inventory management and stock tracking

  - Invoicing and billing

  - Manufacturing and production management

  - Sales and CRM modules

  - Project management

  - Human resources management

  - Self-hosted deployment

  - Open-source platform


  ## Pricing


  Free and open source.


  ## Deployment


  Self-hosted.


  ## Repository


  https://github.com/lsfusion
