markdown: >-
  ## Overview


  Verifone is a global provider of point-of-sale payment terminals and commerce
  solutions. Its devices are used by merchants to accept card, contactless, and
  mobile payments in-store and on the go.


  ## Features


  - Credit and debit card acceptance

  - Contactless NFC payments

  - Apple Pay, Google Pay, Samsung Pay support

  - EMV chip card processing

  - PIN entry and receipt printing

  - Wi-Fi, Ethernet, Bluetooth, and 4G connectivity


  ## Deployment


  Hardware terminals


  ## Pricing


  Commercial paid hardware and payment processing services; pricing varies by
  region and volume.
