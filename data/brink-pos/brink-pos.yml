markdown: >-
  ## Overview


  Brink-POS is a cloud-based restaurant POS software designed to meet customer
  needs, featuring automatic upgrades, access from anywhere, and real-time data
  views. It simplifies menu rollout and improves business efficiency. It is
  positioned for startups, SMBs, mid-market, and enterprise customers.


  ## Features


  - Customer Management

  - Table Management

  - Gift Management

  - Third Party Integrations

  - Menu Management

  - Security Features

  - Real Time

  - Offline Mode


  ## Pricing


  Starting price: $90 per month.


  ## Deployment


  Cloud-based, accessible from anywhere with automatic upgrades.
