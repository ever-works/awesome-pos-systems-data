markdown: >-
  ## Overview


  Poster POS is a cloud-based point-of-sale system designed for front-office
  operations, inventory management, finances, analytics, and customer
  relationship management. It is positioned as easy to set up and provides
  online access to business statistics, finances, and inventory data.


  ## Pricing


  - **Startup**: $14 per month

  - **Mini**: $24 per month

  - **Business**: $34 per month

  - **Pro**: $54 per month


  ## Target Segments


  Poster POS is tailored for startups, SMBs, mid-market businesses, and
  enterprises.


  ## Features


  - Loyalty Programs

  - Order Management

  - Table Management

  - Inventory Management

  - Customer Management

  - Customizable Receipts

  - Online Ordering

  - Employee Management
